<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=block" rel="stylesheet">
<style>*{margin:0;box-sizing:border-box}body{width:1200px;height:1500px;font-family:Lexend;background:#f3efe8;color:#2a2018}
nav{display:flex;justify-content:space-between;align-items:center;padding:34px 60px;border-bottom:1px solid #d8d0c4;font-size:22px}
nav b{font-size:30px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:40px;padding:60px}
.hero h1{font-size:76px;line-height:1.02;letter-spacing:-.03em}.hero p{font-size:24px;margin:24px 0 34px;color:#5b5045}
.btn{display:inline-block;background:#3d2b1f;color:#fff;padding:18px 30px;border-radius:999px;font-size:22px}
.img{height:520px;border-radius:18px;background:linear-gradient(160deg,#8a6a4f,#3b2a1f);position:relative}
.img:after{content:"";position:absolute;left:30%;top:18%;width:22%;height:70%;border-radius:40px 40px 10px 10px;background:linear-gradient(#1d140e,#4b3424)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;padding:0 60px}
.card{background:#fff;border-radius:16px;padding:20px}.card .p{height:260px;border-radius:10px;background:linear-gradient(#c9b9a3,#8d7458)}
.card h3{font-size:24px;margin-top:16px}.card span{font-size:20px;color:#6b5f52}
.form{margin:50px 60px;background:#fff;border-radius:16px;padding:30px;display:flex;gap:20px;align-items:center;font-size:22px}
.form i{flex:1;border-bottom:2px solid #c9beb0;height:40px}
.warn{position:absolute;top:0;left:0;right:0;background:#fff3cd;color:#7a5a00;font-size:20px;padding:10px 60px}
</style></head><body>
<nav><b>Quinta do Souto</b><span>Vinhos · Visitas · Loja · Contacto</span><span>Carrinho (0)</span></nav>
<div class="hero"><div><h1>Vinhos de família desde 1978.</h1><p>Do Douro para a sua mesa, com envio em 48 horas.</p><span class="btn">Ver a loja →</span></div><div class="img"></div></div>
<div class="grid"><div class="card"><div class="p"></div><h3>Reserva Tinto 2019</h3><span>18,50 €</span></div><div class="card"><div class="p"></div><h3>Branco Vinhas Velhas</h3><span>14,00 €</span></div><div class="card"><div class="p"></div><h3>Porto Tawny 10 anos</h3><span>26,00 €</span></div></div>
<div class="form">Newsletter <i></i> <span class="btn">Subscrever</span></div>
</body></html>
