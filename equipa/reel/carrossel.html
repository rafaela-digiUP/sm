<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
/* Reel overlays 1080×1920 — text kept between 1150 and 1560 (clear of Reels UI: bottom ~340px, right ~140px) */
:root{
  --du-black:#0a0305; --du-cream:#f7efe9; --du-white:#ffffff; --du-red:#e8112d;
  --du-cream-86:rgba(247,239,233,.86); --du-cream-14:rgba(247,239,233,.14);
  --du-font-sans:Lexend,Helvetica,sans-serif; --du-font-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#17181a;font-family:var(--du-font-sans);display:flex;flex-wrap:wrap;gap:40px;padding:56px}
body.export{background:transparent;padding:0;gap:0;display:block}
body.export .frame{display:none}
.s{position:relative;width:1080px;height:1920px;overflow:hidden;isolation:isolate;color:var(--du-cream)}
.abs{position:absolute}
.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.scrim{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,3,5,.55) 0%,rgba(10,3,5,0) 16%,rgba(10,3,5,0) 48%,rgba(10,3,5,.86) 66%,rgba(10,3,5,.94) 100%)}
.eyebrow{display:flex;align-items:center;gap:14px;font-family:var(--du-font-mono);font-size:30px;letter-spacing:.06em;color:var(--du-cream-86)}
.eyebrow i{width:14px;height:14px;border-radius:50%;background:var(--du-red)}
.hl{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.hl > div{font-size:96px;font-weight:700;letter-spacing:-.035em;line-height:1.08}
.hl .c{background:var(--du-cream);color:var(--du-black);padding:0 22px 4px;border-radius:8px}
.hl .r{background:var(--du-red);color:var(--du-white);padding:0 22px 4px;border-radius:8px}
.block{position:absolute;left:82px;top:1150px}
</style>
</head>
<body>

<section class="s" id="s1">
  <img class="frame" src="c1_1.8.png" alt="">
  <div class="scrim"></div>
  <img class="abs" src="digiup-white.svg" alt="digiUP" style="left:82px;top:230px;width:130px">
  <div class="block">
    <div class="eyebrow"><i></i>Pessoas primeiro · 1/3</div>
    <div class="hl" style="margin-top:28px"><div>A Lygia</div><div class="c">pensa primeiro</div><div class="r">no papel.</div></div>
  </div>
</section>

<section class="s" id="s2">
  <img class="frame" src="c2_1.8.png" alt="">
  <div class="scrim"></div>
  <img class="abs" src="digiup-white.svg" alt="digiUP" style="left:82px;top:230px;width:130px">
  <div class="block">
    <div class="eyebrow"><i></i>Pessoas primeiro · 2/3</div>
    <div class="hl" style="margin-top:28px"><div>O Abílio</div><div class="c">dá forma</div><div class="r">às ideias.</div></div>
  </div>
</section>

<section class="s" id="s3">
  <img class="frame" src="c3_1.8.png" alt="">
  <div class="scrim"></div>
  <img class="abs" src="digiup-white.svg" alt="digiUP" style="left:82px;top:230px;width:130px">
  <div class="block">
    <div class="eyebrow"><i></i>Pessoas primeiro · 3/3</div>
    <div class="hl" style="margin-top:28px"><div>O Marco</div><div class="c">ouve antes</div><div class="r">de decidir.</div></div>
  </div>
</section>

<section class="s" id="s4" style="background:var(--du-black)">
  <img class="abs" src="net-subtle-1080x1350.svg" alt="" style="inset:0;width:100%;height:100%;object-fit:cover;z-index:-2">
  <div class="abs" style="inset:0;z-index:-1;background:radial-gradient(80% 40% at 70% 30%,rgba(176,14,34,.5) 0%,rgba(10,3,5,0) 70%)"></div>
  <img class="abs" src="digiup-white.svg" alt="digiUP" style="left:82px;top:230px;width:130px">
  <div class="abs" style="left:82px;top:760px;right:140px">
    <div class="hl"><div>Cada desafio</div><div>começa com</div><div class="c">quem o vai</div><div class="r">resolver.</div></div>
    <div style="margin-top:44px;font-size:36px;line-height:1.4;color:var(--du-cream-86)">Pessoas primeiro. Tecnologia com propósito.</div>
    <div style="margin-top:40px;display:inline-flex;align-items:center;gap:14px;background:var(--du-red);color:var(--du-white);border-radius:999px;padding:24px 40px;font-size:32px;font-weight:600">Fale-nos do seu desafio <span>→</span></div>
  </div>
</section>

</body>
</html>
