<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
/* Soluções · Growth & Strategy — 5 slides, uma ideia por slide */
:root{
  --du-black:#0a0305; --du-black-card:#170a0d; --du-cream:#f7efe9; --du-paper:#faf7f4; --du-white:#ffffff;
  --du-red:#e8112d; --du-crimson:#b00e22;
  --du-cream-86:rgba(247,239,233,.86); --du-cream-72:rgba(247,239,233,.72); --du-cream-28:rgba(247,239,233,.28); --du-cream-14:rgba(247,239,233,.14);
  --du-ink:#0a0305; --du-ink-72:rgba(10,3,5,.72); --du-ink-14:rgba(10,3,5,.14);
  --du-font-sans:Lexend,Helvetica,sans-serif; --du-font-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#17181a;font-family:var(--du-font-sans);display:flex;flex-wrap:wrap;gap:48px;padding:56px;align-items:flex-start}
.s{position:relative;width:1080px;height:1350px;flex-shrink:0;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;padding:76px 82px 82px}
.dark{background:var(--du-black);color:var(--du-cream)}
.light{background:var(--du-paper);color:var(--du-ink)}
.red{background:var(--du-crimson);color:var(--du-white)}
.abs{position:absolute}
.top{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:3}
.top img{width:118px;height:auto}
.mono{font-family:var(--du-font-mono);font-size:26px;letter-spacing:.06em;line-height:1.35}
.dark .mono{color:var(--du-cream-86)} .light .mono{color:var(--du-ink-72)} .red .mono{color:var(--du-white)}
.up{text-transform:uppercase}
.giant{font-weight:800;letter-spacing:-.055em;line-height:.92}
.h{font-weight:700;letter-spacing:-.035em;line-height:1.04}
.body{font-size:32px;line-height:1.45;text-wrap:pretty}
.dark .body{color:var(--du-cream-86)} .light .body{color:var(--du-ink-72)} .red .body{color:var(--du-white)}
.arrow{font-size:64px;line-height:1;font-weight:400}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--du-red);margin-right:14px;vertical-align:4px}
.light .dot{background:var(--du-crimson)} .red .dot{background:var(--du-white)}
.hl{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.hl > div{font-size:76px;font-weight:700;letter-spacing:-.035em;line-height:1.08}
.hl .c{background:var(--du-cream);color:var(--du-black);padding:2px 20px;border-radius:6px}
.hl .r{background:var(--du-red);color:var(--du-white);padding:2px 20px;border-radius:6px}
.light .hl .c{background:var(--du-black);color:var(--du-cream)}
.light .hl .r{background:var(--du-crimson)}
.pill{display:inline-block;font-family:var(--du-font-mono);font-weight:500;background:var(--du-crimson);color:var(--du-white);border-radius:999px;padding:4px 26px 8px;letter-spacing:-.01em}
.cta{display:inline-flex;align-items:center;gap:14px;background:var(--du-red);color:var(--du-white);border-radius:999px;padding:24px 40px;font-size:30px;font-weight:600}
.apill{display:inline-flex;align-items:center;border:3px solid currentColor;border-radius:999px;height:56px;padding:0 22px;vertical-align:middle}
.apill svg{display:block}
.foot{margin-top:44px;padding-top:24px;display:flex;justify-content:space-between}
.dark .foot{border-top:1px solid var(--du-cream-14)} .light .foot{border-top:1px solid var(--du-ink-14)}
/* listas numeradas (claro) */
.row{display:grid;grid-template-columns:110px 1fr;align-items:baseline;padding:28px 0;border-top:1px solid var(--du-ink-14)}
.row:last-child{border-bottom:1px solid var(--du-ink-14)}
.row .n{font-family:var(--du-font-mono);font-weight:500;font-size:36px;color:var(--du-crimson)}
.row b{font-size:40px;font-weight:600;letter-spacing:-.02em;line-height:1.22}
.row span.d{display:block;grid-column:2;font-size:30px;line-height:1.4;color:var(--du-ink-72);margin-top:8px}
/* blocos (escuro) */
.area{padding:28px 0;border-top:1px solid var(--du-cream-14)}
.area:last-child{border-bottom:1px solid var(--du-cream-14)}
.area b{display:block;font-size:44px;font-weight:700;letter-spacing:-.025em}
.area span{display:block;font-size:30px;line-height:1.4;color:var(--du-cream-86);margin-top:8px}
.area.num{display:grid;grid-template-columns:100px 1fr}
.area.num i{font-style:normal;font-family:var(--du-font-mono);font-weight:500;font-size:36px;color:var(--du-red);line-height:1.5}
/* números */
.stat{display:grid;grid-template-columns:400px 1fr;align-items:center;padding:24px 0;border-top:2px solid var(--du-ink)}
.stat:last-child{border-bottom:2px solid var(--du-ink)}
.stat .v{font-weight:800;font-size:144px;letter-spacing:-.07em;line-height:.9;color:var(--du-crimson)}
.stat .l{font-size:36px;font-weight:600;line-height:1.25;letter-spacing:-.01em}
</style>
</head>
<body>

<!-- 01 · claro · capa -->
<section class="s light" id="s1">
  <div class="top"><img src="digiup-black.svg" alt="digiUP"><span class="mono up">Growth &amp; Strategy</span></div>
  <div class="giant" style="margin-top:150px;font-size:112px;line-height:1.26">Estratégia<br>com <span style="position:relative;display:inline-block;margin-left:24px">prioridades
    <svg class="abs" style="left:-36px;top:8px;width:calc(100% + 72px);height:160px;overflow:visible" viewBox="0 0 520 180" preserveAspectRatio="none" aria-hidden="true"><path d="M262 6 C 120 -2, 6 36, 4 92 C 2 156, 160 180, 300 176 C 440 172, 518 132, 514 82 C 510 30, 380 0, 230 10 C 190 12, 160 14, 136 16" fill="none" stroke="#b00e22" stroke-width="7" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg></span><br>claras.</div>
  <div style="margin-top:auto;display:flex;justify-content:flex-end"><span class="arrow" aria-hidden="true">→</span></div>
</section>

<!-- 02 · escuro · uma frase gigante -->
<section class="s dark" id="s2" style="justify-content:center">
  <div class="top" style="position:absolute;left:82px;right:82px;top:76px"><img src="digiup-white.svg" alt="digiUP"><span class="mono up">Antes da execução</span></div>
  <div class="giant" style="font-size:150px;line-height:.98">Nem tudo<br>precisa<br>de uma<br><span style="color:var(--du-red)">app.</span></div>
</section>

<!-- 03 · claro · ruído vs dados -->
<section class="s light" id="s3">
  <div class="top"><img src="digiup-black.svg" alt="digiUP"><span class="mono up">Dados acima de opiniões</span></div>
  <svg aria-hidden="true" style="margin-top:170px;margin-left:-82px;width:1080px;height:300px;overflow:visible" viewBox="0 0 1080 300" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 150 L24 70 L44 230 L68 40 L88 260 L112 100 L132 200 L156 30 L178 240 L202 120 L222 210 L246 70 L268 230 L290 130 L312 180 L336 100 L358 210 L382 130 L404 170 L428 120 L450 160 L474 140 L496 150" stroke="rgba(10,3,5,.35)" stroke-width="6"/>
    <path d="M496 150 C 600 150, 660 210, 760 190 S 920 70, 1000 50" stroke="#b00e22" stroke-width="10"/>
    <circle cx="1000" cy="50" r="22" fill="#b00e22"/>
  </svg>
  <div class="h" style="margin-top:auto;font-size:96px">Decisões por dados.<br><span style="color:var(--du-ink-72)">Não por ruído.</span></div>
</section>

<!-- 04 · carmim · quatro verbos -->
<section class="s red" id="s4">
  <div class="top"><img src="digiup-white.svg" alt="digiUP"><span class="mono up">Metodologia</span></div>
  <div class="giant" style="margin-top:auto;font-size:168px;line-height:1">Medir.<br>Modelar.<br>Testar.<br>Evoluir.</div>
</section>

<!-- 05 · escuro · CTA -->
<section class="s dark" id="s5">
  <div class="abs" style="inset:0;z-index:-1;background:radial-gradient(70% 50% at 70% 30%,rgba(176,14,34,.45) 0%,rgba(10,3,5,0) 70%)"></div>
  <div class="top"><img src="digiup-white.svg" alt="digiUP"><span class="mono up">digiup.me</span></div>
  <div style="margin-top:auto">
    <div class="hl"><div>Onde vale a pena</div><div class="c">investir agora?</div></div>
    <span class="cta" style="margin-top:56px">Fale-nos do seu desafio <span>→</span></span>
  </div>
</section>

</body>
</html>
