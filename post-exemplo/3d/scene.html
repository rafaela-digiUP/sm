<!doctype html>
<html><head><meta charset="utf-8">

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';

import { Font } from 'three/addons/loaders/FontLoader.js';

const P = new URLSearchParams(location.search);
const mode = P.get('mode') || 'hero';
const W = +P.get('w') || 2000, H = +P.get('h') || 1600;
await document.fonts.load('600 80px Lexend'); await document.fonts.load('500 40px "JetBrains Mono"');

RectAreaLightUniformsLib.init();
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });

const scene = new THREE.Scene();

scene.environmentIntensity = 0.12;

const RED = 0xe8112d, CREAM = '#f7efe9';

function legendTexture(text, sub, w, h, color = CREAM) {

  const g = c.getContext('2d');
  g.fillStyle = color; g.textBaseline = 'top';
  g.font = `600 ${Math.round(h * 0.26)}px Lexend`;
  g.fillText(text, w * 0.11, h * 0.13);
  if (sub) { g.font = `500 ${Math.round(h * 0.2)}px "JetBrains Mono"`; g.fillText(sub, w * 0.11, h * 0.56); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

function keycap(u = 1, text = '', sub = '', opts = {}) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new RoundedBoxGeometry(u - 0.08, 0.42, 0.92, 8, 0.11), capMat());
  base.position.y = 0.21; base.castShadow = true; base.receiveShadow = true; g.add(base);
  if (text || sub) {
    const tw = u - 0.24, th = 0.72;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(tw, th),
      new THREE.MeshBasicMaterial({ map: legendTexture(text, sub, Math.round(512 * tw / th), 512, opts.legend || CREAM), transparent: true, toneMapped: false, opacity: opts.legendOpacity ?? 0.92 }));
    m.rotation.x = -Math.PI / 2; m.position.set(0, 0.4205, 0); g.add(m);
  }

}

let camera;
function padlock(open) {
  const g = new THREE.Group();
  const mat = capMat();
  const body = new THREE.Mesh(new RoundedBoxGeometry(1.7, 1.35, 0.72, 8, 0.16), mat); body.castShadow = true; g.add(body);
  const hole = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.1, 32), new THREE.MeshBasicMaterial({ color: RED, toneMapped: false }));
  hole.rotation.x = Math.PI / 2; hole.position.set(0, 0.1, 0.33); g.add(hole);
  const slot = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.32, 0.1), new THREE.MeshBasicMaterial({ color: RED, toneMapped: false }));
  slot.position.set(0, -0.12, 0.33); g.add(slot);
  const steel = new THREE.MeshPhysicalMaterial({ color: 0x2a2224, metalness: 1.0, roughness: 0.22, clearcoat: 0.4 });
  const sh = new THREE.Group();
  const arc = new THREE.Mesh(new THREE.TorusGeometry(0.52, 0.13, 32, 64, Math.PI), steel); arc.position.y = 0.9; sh.add(arc);
  const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.5, 32), steel); legL.position.set(-0.52, 0.65, 0); sh.add(legL);
  const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, open ? 0.5 : 0.5, 32), steel); legR.position.set(0.52, 0.65, 0); sh.add(legR);
  sh.children.forEach(m => m.castShadow = true);
  if (open) { sh.position.set(0.52, 0.42, 0); sh.children.forEach(m => m.position.x -= 0.52); sh.rotation.y = -1.0; }
  g.add(sh);
  return g;
}
if (mode === 'lock-open' || mode === 'lock-closed') {
  const lk = padlock(mode === 'lock-open'); lk.rotation.set(0.08, -0.45, mode === 'lock-open' ? -0.12 : 0.06); lk.position.y = -0.25; scene.add(lk);
  camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
  camera.position.set(-0.8, 0.9, 6.0); camera.lookAt(0.05, 0.35, 0);
  const rim = new THREE.RectAreaLight(RED, 50, 4, 1.4); rim.position.set(2.6, 1.4, -2.2); rim.lookAt(0, 0.2, 0); scene.add(rim);
  const rim2 = new THREE.RectAreaLight(0xff2b3b, 18, 3, 0.8); rim2.position.set(-2.8, -0.6, -1.8); rim2.lookAt(0, 0, 0); scene.add(rim2);
  const key = new THREE.SpotLight(0xffe2d6, 9, 14, 0.5, 0.9, 1.6); key.position.set(-3.0, 3.6, 3.4); key.target.position.set(0, 0, 0); scene.add(key, key.target);
  const glow = new THREE.PointLight(RED, 3, 2.5, 1.5); glow.position.set(0, 0, 1.1); lk.add(glow);
} else if (mode === 'q') {
  const json = await new Promise((res, rej) => new TTFLoader().load('./lexend-700.ttf', res, undefined, rej));
  const font = new Font(json);
  const geo = new TextGeometry('?', { font, size: 2.4, height: 0.15, curveSegments: 40, bevelEnabled: true, bevelThickness: 0.55, bevelSize: 0.2, bevelSegments: 32 });
  geo.computeBoundingBox(); geo.center(); geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ color: 0xc40c24, roughness: 0.28, clearcoat: 1.0, clearcoatRoughness: 0.06 }));
  m.rotation.set(0.1, -0.55, 0.14); scene.add(m);
  scene.environmentIntensity = 0.22; renderer.toneMapping = THREE.LinearToneMapping; renderer.toneMappingExposure = 0.85;
  camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
  camera.position.set(-0.5, 0.3, 7.4); camera.lookAt(0, 0, 0);
  const key = new THREE.SpotLight(0xfff1ea, 5, 16, 0.6, 0.9, 1.4); key.position.set(-4.5, 4.5, 3.0); key.target.position.set(0, 0, 0); scene.add(key, key.target);
  const rim = new THREE.RectAreaLight(0xffffff, 10, 4, 2); rim.position.set(3.2, 1.5, -2.5); rim.lookAt(0, 0, 0); scene.add(rim);
  const fill = new THREE.RectAreaLight(0xff2b3b, 14, 4, 2); fill.position.set(-3, -2, 1.5); fill.lookAt(0, 0, 0); scene.add(fill);
} else if (mode === 'aa') {
  const json = await new Promise((res, rej) => new TTFLoader().load('./lexend-700.ttf', res, undefined, rej));
  const font = new Font(json);
  const geo = new TextGeometry('AA', { font, size: 1.6, height: 0.55, curveSegments: 16, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.035, bevelSegments: 6 });
  geo.computeBoundingBox(); geo.center();
  const m = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ color: 0x0d0607, roughness: 0.3, clearcoat: 0.8, clearcoatRoughness: 0.18 }));
  m.rotation.set(-0.12, -0.5, 0.04); m.castShadow = true; scene.add(m);
  camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 100);
  camera.position.set(-0.6, 0.7, 6.2); camera.lookAt(0.1, 0, 0);
  const rim = new THREE.RectAreaLight(RED, 55, 4, 1.2); rim.position.set(2.6, 1.0, -2.2); rim.lookAt(0, 0, 0); scene.add(rim);
  const rim2 = new THREE.RectAreaLight(0xff2b3b, 22, 4, 0.8); rim2.position.set(-2.8, -1.2, -1.5); rim2.lookAt(0, 0, 0); scene.add(rim2);
  const key = new THREE.SpotLight(0xffe2d6, 10, 14, 0.5, 0.9, 1.6); key.position.set(-3.2, 3.4, 3.6); key.target.position.set(0, 0, 0); scene.add(key, key.target);
} else if (mode === 'hero') {
  // one giant Tab key, 3/4 view, red rim light
  const k = keycap(1.6, 'Tab', '⇥'); k.rotation.y = -0.42; scene.add(k);
  camera = new THREE.PerspectiveCamera(30, W / H, 0.1, 100);
  camera.position.set(-0.75, 2.05, 2.25); camera.lookAt(0.12, 0.15, 0);
  const rim = new THREE.RectAreaLight(RED, 34, 3, 0.6); rim.position.set(1.7, 0.7, -1.6); rim.lookAt(0, 0.4, 0); scene.add(rim);
  const rim2 = new THREE.RectAreaLight(0xff2b3b, 14, 2, 1); rim2.position.set(-2.2, 0.6, -1.4); rim2.lookAt(0, 0.4, 0); scene.add(rim2);
  const key = new THREE.SpotLight(0xffe2d6, 7, 12, 0.5, 0.9, 1.6); key.position.set(-3.2, 3.2, 1.2); key.target.position.set(0, 0.4, 0); key.castShadow = true; scene.add(key, key.target);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.55 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
} else {
  // a keyboard field at a low angle, receding into the dark
  const rows = [
    [['Esc', ''], ['', '1'], ['', '2'], ['', '3'], ['', '4'], ['', '5'], ['', '6'], ['', '7'], ['', '8']],
    [['Tab', '⇥', 1.5], ['Q'], ['W'], ['E'], ['R'], ['T'], ['Y'], ['U'], ['I']],
    [['Caps', '', 1.75], ['A'], ['S'], ['D'], ['F'], ['G'], ['H'], ['J'], ['K']],
    [['Shift', '', 2.25], ['Z'], ['X'], ['C'], ['V'], ['B'], ['N'], ['M'], [',']],
    [['', '', 1.25], ['', '', 1.25], ['', '', 1.25], ['Espaço', '', 6.25]],
  ];
  const kb = new THREE.Group();
  rows.forEach((row, r) => {
    let x = r === 0 ? 0 : 0;
    row.forEach(([t, s, u = 1]) => {
      const hl = t === 'Tab';
      const k = keycap(u, t, s || '', { legendOpacity: hl ? 1 : 0.55 });
      k.position.set(x + u / 2, 0, r * 1.0); kb.add(k);
      if (hl) {
        const ring = new THREE.Mesh(new RoundedBoxGeometry(u + 0.02, 0.07, 1.0, 4, 0.03), new THREE.MeshBasicMaterial({ color: RED, toneMapped: false }));
        ring.position.set(x + u / 2, 0.035, r); kb.add(ring);
        const glow = new THREE.PointLight(RED, 4, 2.2, 1.6); glow.position.set(x + u / 2, 0.9, r - 0.15); kb.add(glow);
      }
      x += u;
    });
  });
  kb.position.set(-6.2, 0, -2.6); scene.add(kb);
  camera = new THREE.PerspectiveCamera(28, W / H, 0.1, 100);
  camera.position.set(-1.6, 3.0, 4.6); camera.lookAt(-3.6, 0.2, -1.1);
  const rim = new THREE.RectAreaLight(RED, 30, 12, 1.2); rim.position.set(-1, 1.2, -6.5); rim.lookAt(-2, 0.3, 0); scene.add(rim);
  const key = new THREE.SpotLight(0xffe2d6, 30, 14, 0.42, 0.9, 1.6); key.position.set(-5.5, 5.0, 2.4); key.target.position.set(-4.4, 0.4, -1.2); key.castShadow = true; scene.add(key, key.target);
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x0a0305, roughness: 0.9 })); plate.rotation.x = -Math.PI / 2; plate.receiveShadow = true; scene.add(plate);

}
renderer.render(scene, camera);
window.__done = true;
</script>
